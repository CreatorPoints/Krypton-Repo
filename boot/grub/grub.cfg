### BEGIN /etc/grub.d/00_header ###
if [ -s $prefix/grubenv ]; then
  set have_grubenv=true
  load_env
fi
if [ "${next_entry}" ] ; then
   set default="${next_entry}"
   set next_entry=
   save_env next_entry
   set boot_once=true
else
   set default="0"
fi

if [ x"${feature_menuentry_id}" = xy ]; then
  menuentry_id_option="--id"
else
  menuentry_id_option=""
fi

export menuentry_id_option

if [ "${prev_saved_entry}" ]; then
  set saved_entry="${prev_saved_entry}"
  save_env saved_entry
  set prev_saved_entry=
  save_env prev_saved_entry
  set boot_prev_saved_entry=1
fi

function savedefault {
  if [ -z "${boot_once}" ]; then
    saved_entry="${chosen}"
    save_env saved_entry
  fi
}

function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod efi_gop
    insmod efi_uga
    insmod ieee1275_fb
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}

terminal_input console
terminal_output console
if [ x$feature_timeout_style = xy ] ; then
  set timeout_style=menu
  set timeout=5
else
  set timeout=5
fi
### END /etc/grub.d/00_header ###

### BEGIN /etc/grub.d/10_linux ###
function gfxmode {
	set gfxpayload="${1}"
}
set linux_gfx_mode=
export linux_gfx_mode
menuentry 'KryptonOS GNU/Linux' --class krypton --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-simple-7f8a-99b2-krypton' {
	load_video
	insmod gzio
	if [ x$grub_platform = xx86_64-efi ]; then
		insmod part_gpt
		insmod ext2
	fi
	insmod part_gpt
	insmod ext2
	search --no-floppy --fs-uuid --set=root 7f8a-99b2-krypton
	echo	'Loading Linux 6.10.0-krypton-generic ...'
	linux	/boot/vmlinuz-6.10.0-krypton-generic root=UUID=7f8a-99b2-krypton ro  quiet splash vt.handoff=7
	echo	'Loading initial ramdisk ...'
	initrd	/boot/initrd.img-6.10.0-krypton-generic
}
submenu 'Advanced options for KryptonOS GNU/Linux' $menuentry_id_option 'gnulinux-advanced-7f8a-99b2-krypton' {
	menuentry 'KryptonOS GNU/Linux, with Linux 6.10.0-krypton-generic (recovery mode)' --class krypton --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-6.10.0-krypton-generic-recovery-7f8a-99b2-krypton' {
		load_video
		insmod gzio
		insmod part_gpt
		insmod ext2
		search --no-floppy --fs-uuid --set=root 7f8a-99b2-krypton
		echo	'Loading Linux 6.10.0-krypton-generic ...'
		linux	/boot/vmlinuz-6.10.0-krypton-generic root=UUID=7f8a-99b2-krypton ro recovery nomodeset 
